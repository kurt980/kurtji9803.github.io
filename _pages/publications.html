---
layout: profile
title: "Publications"
permalink: /publications/
---
{% assign papers = site.publications | sort: 'year' | reverse %}
{% for paper in papers %}
<article class="publication-entry">
  <h2><a href="{{ paper.paperurl }}">{{ paper.title }}</a></h2>
  <p>{{ paper.authors }}</p>
  <p class="entry-meta">{{ paper.venue }} · {{ paper.year }}</p>
  <p><a href="{{ paper.paperurl }}">Publisher / DOI</a></p>
</article>
{% endfor %}
